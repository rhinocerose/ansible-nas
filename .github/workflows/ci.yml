---
name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v7

      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: pip3 install ansible yamllint==1.38.0 ansible-lint==26.11.0

      - name: Ansible-lint
        run: ansible-lint nas.yml

      - name: Lint yaml files
        run: yamllint .

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Same markdownlint-cli version as .pre-commit-config.yaml. Uses .markdownlint.json and .markdownlintignore.
      - name: Lint docs
        run: npx --yes markdownlint-cli@0.50.0 "**/*.{md,markdown}"

  syntax-check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v7

      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Ansible
        run: pip3 install ansible

      - name: Install Galaxy roles and collections
        run: ansible-galaxy install -r requirements.yml

      - name: Check playbook syntax
        run: ansible-playbook --syntax-check -i tests/inventories/integration_testing/inventory nas.yml
