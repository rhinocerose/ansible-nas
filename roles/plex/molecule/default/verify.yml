---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get plex container state
      community.docker.docker_container:
        name: "{{ plex_container_name }}"
      register: plex_result

    - name: Check if plex containers are running
      ansible.builtin.assert:
        that:
          - plex_result.container['State']['Status'] == "running"
          - plex_result.container['State']['Restarting'] == false
