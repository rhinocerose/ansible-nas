---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Try and stop and remove Homer
      community.docker.docker_container:
        name: "{{ homer_container_name }}"
        state: absent
      register: homer_result

    - name: Check if Homer is stopped
      ansible.builtin.assert:
        that:
          - not homer_result.changed
