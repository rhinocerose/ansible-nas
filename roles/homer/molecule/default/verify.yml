---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get Homer container state
      community.docker.docker_container:
        name: "{{ homer_container_name }}"
      register: homer_result

    - name: Check if Homer is running
      ansible.builtin.assert:
        that:
          - homer_result.container['State']['Status'] == "running"
          - homer_result.container['State']['Restarting'] == false
