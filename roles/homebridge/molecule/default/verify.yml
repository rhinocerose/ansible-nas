---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get homebridge container state
      community.docker.docker_container:
        name: "{{ homebridge_container_name }}"
      register: homebridge_result

    - name: Check if homebridge containers are running
      ansible.builtin.assert:
        that:
          - homebridge_result.container['State']['Status'] == "running"
          - homebridge_result.container['State']['Restarting'] == false
