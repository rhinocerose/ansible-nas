---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get Immich server container state
      community.docker.docker_container:
        name: "{{ immich_server_container_name }}"
      register: immich_result_server

    - name: Get Immich machine learning container state
      community.docker.docker_container:
        name: "{{ immich_machine_learning_container_name }}"
      register: immich_result_machine_learning

    - name: Get Immich PostgreSQL container state
      community.docker.docker_container:
        name: "{{ immich_db_container_name }}"
      register: immich_result_db

    - name: Get Immich Redis container state
      community.docker.docker_container:
        name: "{{ immich_redis_container_name }}"
      register: immich_result_redis

    - name: Check if Immich containers are running
      ansible.builtin.assert:
        that:
          - immich_result_server.container['State']['Status'] == "running"
          - immich_result_server.container['State']['Restarting'] == false
          - immich_result_machine_learning.container['State']['Status'] == "running"
          - immich_result_machine_learning.container['State']['Restarting'] == false
          - immich_result_db.container['State']['Status'] == "running"
          - immich_result_db.container['State']['Restarting'] == false
          - immich_result_redis.container['State']['Status'] == "running"
          - immich_result_redis.container['State']['Restarting'] == false
