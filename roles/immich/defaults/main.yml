---
immich_enabled: false
immich_available_externally: false

# directories
immich_data_directory: "{{ docker_home }}/immich"
immich_upload_directory: "{{ photos_root }}/immich"
immich_postgres_directory: "{{ immich_data_directory }}/postgres"
immich_model_cache_directory: "{{ immich_data_directory }}/model-cache"

# network
immich_hostname: "immich"
immich_network_name: "immich"
immich_port: "2283"

# database
immich_db_name: "immich"
immich_db_user: "postgres"
immich_db_password: "postgres"

# docker
immich_server_container_name: "immich-server"
immich_server_image_name: "ghcr.io/immich-app/immich-server"
immich_server_image_version: "release"
immich_machine_learning_container_name: "immich-machine-learning"
immich_machine_learning_image_name: "ghcr.io/immich-app/immich-machine-learning"
immich_machine_learning_image_version: "release"
immich_redis_container_name: "immich-redis"
immich_redis_image_name: "valkey/valkey"
immich_redis_image_version: "9"
immich_db_container_name: "immich-postgres"
immich_db_image_name: "ghcr.io/immich-app/postgres"
immich_db_image_version: "14-vectorchord0.4.3-pgvectors0.2.0"

# specs
immich_server_memory: "2g"
immich_machine_learning_memory: "2g"
immich_redis_memory: "512m"
immich_db_memory: "1g"
