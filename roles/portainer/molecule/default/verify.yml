---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get portainer container state
      community.docker.docker_container:
        name: "{{ portainer_container_name }}"
      register: portainer_result

    - name: Check if portainer containers are running
      ansible.builtin.assert:
        that:
          - portainer_result.container['State']['Status'] == "running"
          - portainer_result.container['State']['Restarting'] == false
