---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get navidrome container state
      community.docker.docker_container:
        name: "{{ navidrome_container_name }}"
      register: navidrome_result

    - name: Check if navidrome containers are running
      ansible.builtin.assert:
        that:
          - navidrome_result.container['State']['Status'] == "running"
          - navidrome_result.container['State']['Restarting'] == false
