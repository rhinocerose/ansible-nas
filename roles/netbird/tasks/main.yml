---
- name: Start NetBird
  block:
    - name: Create NetBird Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      with_items:
        - "{{ netbird_config_directory }}"
        - "{{ netbird_data_directory }}"

    - name: Create NetBird network
      community.docker.docker_network:
        name: "{{ netbird_network_name }}"
      register: netbird_network_result

    - name: Template NetBird server configuration
      ansible.builtin.template:
        src: config.yaml.j2
        dest: "{{ netbird_config_directory }}/config.yaml"
        mode: "0600"
      register: netbird_config

    - name: NetBird Server Docker Container
      community.docker.docker_container:
        name: "{{ netbird_server_container_name }}"
        image: "{{ netbird_server_image_name }}:{{ netbird_server_image_version }}"
        pull: true
        networks:
          - name: "{{ netbird_network_name }}"
        network_mode: "{{ netbird_network_name }}"
        volumes:
          - "{{ netbird_data_directory }}:/var/lib/netbird:rw"
          - "{{ netbird_config_directory }}/config.yaml:/etc/netbird/config.yaml:ro"
        ports:
          - "{{ netbird_port_server }}:80"
          - "{{ netbird_port_stun }}:{{ netbird_port_stun }}/udp"
        command:
          - "--config"
          - "/etc/netbird/config.yaml"
        restart_policy: unless-stopped
        restart: "{{ netbird_config is changed }}"
        memory: "{{ netbird_server_memory }}"
        labels:
          traefik.enable: "{{ netbird_available_externally | string }}"
          traefik.http.routers.netbird-grpc.rule: "Host(`{{ netbird_hostname }}.{{ ansible_nas_domain }}`) && (PathPrefix(`/signalexchange.SignalExchange/`) || PathPrefix(`/management.ManagementService/`) || PathPrefix(`/management.ProxyService/`))"
          traefik.http.routers.netbird-grpc.priority: "100"
          traefik.http.routers.netbird-grpc.service: "netbird-server-h2c"
          traefik.http.routers.netbird-grpc.tls.certresolver: "letsencrypt"
          traefik.http.routers.netbird-grpc.tls.domains[0].main: "{{ ansible_nas_domain }}"
          traefik.http.routers.netbird-grpc.tls.domains[0].sans: "*.{{ ansible_nas_domain }}"
          traefik.http.routers.netbird-backend.rule: "Host(`{{ netbird_hostname }}.{{ ansible_nas_domain }}`) && (PathPrefix(`/relay`) || PathPrefix(`/ws-proxy/`) || PathPrefix(`/api`) || PathPrefix(`/oauth2`))"
          traefik.http.routers.netbird-backend.priority: "100"
          traefik.http.routers.netbird-backend.service: "netbird-server"
          traefik.http.routers.netbird-backend.tls.certresolver: "letsencrypt"
          traefik.http.routers.netbird-backend.tls.domains[0].main: "{{ ansible_nas_domain }}"
          traefik.http.routers.netbird-backend.tls.domains[0].sans: "*.{{ ansible_nas_domain }}"
          traefik.http.services.netbird-server.loadbalancer.server.port: "80"
          traefik.http.services.netbird-server-h2c.loadbalancer.server.port: "80"
          traefik.http.services.netbird-server-h2c.loadbalancer.server.scheme: "h2c"
      when: not (ansible_check_mode and netbird_network_result is changed) # network only exists after a real run

    - name: NetBird Dashboard Docker Container
      community.docker.docker_container:
        name: "{{ netbird_dashboard_container_name }}"
        image: "{{ netbird_dashboard_image_name }}:{{ netbird_dashboard_image_version }}"
        pull: true
        networks:
          - name: "{{ netbird_network_name }}"
        network_mode: "{{ netbird_network_name }}"
        ports:
          - "{{ netbird_port }}:80"
        env:
          NETBIRD_MGMT_API_ENDPOINT: "{{ netbird_public_url }}"
          NETBIRD_MGMT_GRPC_API_ENDPOINT: "{{ netbird_public_url }}"
          AUTH_AUDIENCE: "netbird-dashboard"
          AUTH_CLIENT_ID: "netbird-dashboard"
          AUTH_CLIENT_SECRET: ""
          AUTH_AUTHORITY: "{{ netbird_public_url }}/oauth2"
          USE_AUTH0: "false"
          AUTH_SUPPORTED_SCOPES: "openid profile email groups"
          AUTH_REDIRECT_URI: "/nb-auth"
          AUTH_SILENT_REDIRECT_URI: "/nb-silent-auth"
          NGINX_SSL_PORT: "443"
          LETSENCRYPT_DOMAIN: "none"
        restart_policy: unless-stopped
        memory: "{{ netbird_dashboard_memory }}"
        labels:
          traefik.enable: "{{ netbird_available_externally | string }}"
          traefik.http.routers.netbird-dashboard.rule: "Host(`{{ netbird_hostname }}.{{ ansible_nas_domain }}`)"
          traefik.http.routers.netbird-dashboard.priority: "1"
          traefik.http.routers.netbird-dashboard.tls.certresolver: "letsencrypt"
          traefik.http.routers.netbird-dashboard.tls.domains[0].main: "{{ ansible_nas_domain }}"
          traefik.http.routers.netbird-dashboard.tls.domains[0].sans: "*.{{ ansible_nas_domain }}"
          traefik.http.services.netbird-dashboard.loadbalancer.server.port: "80"
      when: not (ansible_check_mode and netbird_network_result is changed) # network only exists after a real run
  when: netbird_enabled is true

- name: Stop NetBird
  block:
    - name: Stop NetBird Dashboard
      community.docker.docker_container:
        name: "{{ netbird_dashboard_container_name }}"
        state: absent

    - name: Stop NetBird Server
      community.docker.docker_container:
        name: "{{ netbird_server_container_name }}"
        state: absent
  when: netbird_enabled is false
