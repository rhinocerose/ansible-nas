---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get openhab container state
      community.docker.docker_container:
        name: "{{ openhab_container_name }}"
      register: openhab_result

    - name: Check if openhab containers are running
      ansible.builtin.assert:
        that:
          - openhab_result.container['State']['Status'] == "running"
          - openhab_result.container['State']['Restarting'] == false
