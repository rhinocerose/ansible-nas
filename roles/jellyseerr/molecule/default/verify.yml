---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get jellyseerr container state
      community.docker.docker_container:
        name: "{{ jellyseerr_container_name }}"
      register: jellyseerr_result

    - name: Check if jellyseerr containers are running
      ansible.builtin.assert:
        that:
          - jellyseerr_result.container['State']['Status'] == "running"
          - jellyseerr_result.container['State']['Restarting'] == false
