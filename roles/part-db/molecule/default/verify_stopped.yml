---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Try and stop and remove Part-DB
      community.docker.docker_container:
        name: "{{ partdb_container_name }}"
        state: absent
      register: part_db_result

    - name: Check if Part-DB is stopped
      ansible.builtin.assert:
        that:
          - not part_db_result.changed
