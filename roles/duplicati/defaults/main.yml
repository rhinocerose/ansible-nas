---
duplicati_enabled: false
duplicati_available_externally: false

# directories
duplicati_data_directory: "{{ docker_home }}/duplicati/config"

# permissions
duplicati_data_permissions: "ro" # set this to rw to enable the ability to restore data

# uid / gid
duplicati_user_id: "0"
duplicati_group_id: "0"

# network
duplicati_port: "8200"
duplicati_hostname: "duplicati"

duplicati_memory: 1g

# docker
duplicati_container_name: duplicati

# image (pinned to the image running on the NAS; set to "latest" to follow upstream)
duplicati_image_name: "linuxserver/duplicati"
# v2.4.1.0_stable_2026-10-29-ls319 (digest pin; set to a tag such as "latest" to follow upstream instead)
duplicati_image_version: "sha256:db8a6ca2f2b5f8767cfdfbce18dc9439bb0a570c91878288b62cbc8549b61c5e"
