---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get container state
      community.docker.docker_container_info:
        name: "{{ firefly_container_name }}"
      register: firefly_result

    - name: Get container state
      community.docker.docker_container_info:
        name: "{{ firefly_mysql_container_name }}"
      register: firefly_result_mysql

    - name: Check Firefly is running
      ansible.builtin.assert:
        that:
          - firefly_result.container['State']['Status'] == "running"
          - firefly_result.container['State']['Restarting'] == false
          - firefly_result_mysql.container['State']['Status'] == "running"
          - firefly_result_mysql.container['State']['Restarting'] == false
