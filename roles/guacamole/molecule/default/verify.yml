---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get guacamole container state
      community.docker.docker_container:
        name: "{{ guacamole_container_name }}"
      register: guacamole_result

    - name: Check if guacamole containers are running
      ansible.builtin.assert:
        that:
          - guacamole_result.container['State']['Status'] == "running"
          - guacamole_result.container['State']['Restarting'] == false
