---
airsonic_enabled: false
airsonic_available_externally: false

# directories
airsonic_data_directory: "{{ docker_home }}/airsonic"
airsonic_music_directory: "{{ music_root }}"
airsonic_podcasts_directory: "{{ podcasts_root }}"

# network
airsonic_port: "4040"
airsonic_hostname: "airsonic"

# specs
airsonic_memory: 1g

# docker
airsonic_container_name: airsonic

# image (pinned to the image running on the NAS; set to "latest" to follow upstream)
airsonic_image_name: "airsonic/airsonic"
airsonic_image_version: "latest@sha256:2222c5710cca2c6396e90151cab6e2af17110006100f8895d35dcf27aa7af551"
