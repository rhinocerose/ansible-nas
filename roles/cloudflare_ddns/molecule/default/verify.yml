---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get container state
      community.docker.docker_container_info:
        name: "{{ cloudflare_ddns_container_name }}"
      register: cloudflare_ddns_result

    - name: Check Cloudflare DDNS is running
      ansible.builtin.assert:
        that:
          - cloudflare_ddns_result.container['State']['Status'] == "running"
          - cloudflare_ddns_result.container['State']['Restarting'] == false
