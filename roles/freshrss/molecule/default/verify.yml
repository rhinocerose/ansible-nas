---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get freshrss container state
      community.docker.docker_container:
        name: "{{ freshrss_container_name }}"
      register: freshrss_result

    - name: Check if freshrss containers are running
      ansible.builtin.assert:
        that:
          - freshrss_result.container['State']['Status'] == "running"
          - freshrss_result.container['State']['Restarting'] == false
