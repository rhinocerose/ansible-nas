---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get route53 container state
      community.docker.docker_container:
        name: "{{ route53_ddns_container_name }}"
      register: route53_ddns_result

    - name: Check if route53 containers are running
      ansible.builtin.assert:
        that:
          - route53_ddns_result.container['State']['Status'] == "running"
          - route53_ddns_result.container['State']['Restarting'] == false
