---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get speedtest container state
      community.docker.docker_container:
        name: "{{ speedtest_container_name }}"
      register: speedtest_tracker_result

    - name: Check if speedtest containers are running
      ansible.builtin.assert:
        that:
          - speedtest_tracker_result.container['State']['Status'] == "running"
          - speedtest_tracker_result.container['State']['Restarting'] == false
