---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get utorrent container state
      community.docker.docker_container:
        name: "{{ utorrent_container_name }}"
      register: utorrent_result

    - name: Check if utorrent containers are running
      ansible.builtin.assert:
        that:
          - utorrent_result.container['State']['Status'] == "running"
          - utorrent_result.container['State']['Restarting'] == false
