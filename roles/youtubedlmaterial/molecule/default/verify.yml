---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get youtubedlmaterial container state
      community.docker.docker_container:
        name: "{{ youtubedlmaterial_container_name }}"
      register: youtubedlmaterial_result

    - name: Check if youtubedlmaterial containers are running
      ansible.builtin.assert:
        that:
          - youtubedlmaterial_result.container['State']['Status'] == "running"
          - youtubedlmaterial_result.container['State']['Restarting'] == false
