---
partdb_enabled: false
partdb_available_externally: false

# directories
partdb_data_directory: "{{ docker_home }}/partdb"
partdb_db_data_directory: "{{ partdb_data_directory }}/mysql"

# network
partdb_port_http: "10091"
partdb_port_https: "10454"
partdb_hostname: "partdb"
partdb_network_name: "partdb"

# docker
partdb_container_name: "partdb"
partdb_image_name: "jbtronics/part-db1"
partdb_image_version: "latest"
partdb_user_id: "1000"
partdb_group_id: "1000"

# specs
partdb_memory: 1g

# database
partdb_db_container: partdb_db
partdb_db_image_name: "mariadb"
partdb_db_image_version: "10.11"
partdb_db_name: partdb
partdb_db_user: partdb
# change these!
partdb_db_password: "partdb-pass"
partdb_db_root_password: "partdb-root-pass"
partdb_db_memory: 512m
