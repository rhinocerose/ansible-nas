---
- name: Start partdb
  block:
    - name: Create partdb Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      with_items:
        - "{{ partdb_data_directory }}"
        - "{{ partdb_db_data_directory }}"

    - name: Create partdb network
      community.docker.docker_network:
        name: "{{ partdb_network_name }}"
      register: partdb_network_result

    - name: Partdb MariaDB Docker Container
      community.docker.docker_container:
        name: "{{ partdb_db_container }}"
        image: "{{ partdb_db_image_name }}:{{ partdb_db_image_version }}"
        pull: true
        networks:
          - name: "{{ partdb_network_name }}"
        network_mode: "{{ partdb_network_name }}"
        volumes:
          - "{{ partdb_db_data_directory }}:/var/lib/mysql"
        env:
          TZ: "{{ ansible_nas_timezone }}"
          MARIADB_USER: "{{ partdb_db_user }}"
          MARIADB_PASSWORD: "{{ partdb_db_password }}"
          MARIADB_DATABASE: "{{ partdb_db_name }}"
          MARIADB_ROOT_PASSWORD: "{{ partdb_db_root_password }}"
        restart_policy: unless-stopped
        memory: "{{ partdb_db_memory }}"
      when: not (ansible_check_mode and partdb_network_result is changed) # network only exists after a real run

    - name: Create partdb container
      community.docker.docker_container:
        name: "{{ partdb_container_name }}"
        image: "{{ partdb_image_name }}:{{ partdb_image_version }}"
        pull: true
        networks:
          - name: "{{ partdb_network_name }}"
        network_mode: "{{ partdb_network_name }}"
        volumes:
          - "{{ partdb_data_directory }}/uploads:/var/www/html/uploads"
          - "{{ partdb_data_directory }}/public_media:/var/www/html/public/media"
          - "{{ partdb_data_directory }}/db:/var/www/html/var/db"
        env:
          PUID: "{{ partdb_user_id }}"
          PGID: "{{ partdb_group_id }}"
          TZ: "{{ ansible_nas_timezone }}"
          DATABASE_URL: "mysql://{{ partdb_db_user | urlencode }}:{{ partdb_db_password | urlencode }}@{{ partdb_db_container }}:3306/{{ partdb_db_name }}"
          DB_AUTOMIGRATE: "true"
        ports:
          - "{{ partdb_port_http }}:80"
          - "{{ partdb_port_https }}:443"
        restart_policy: unless-stopped
        memory: "{{ partdb_memory }}"
        labels:
          traefik.enable: "{{ partdb_available_externally | string }}"
          traefik.http.routers.partdb.rule: "Host(`{{ partdb_hostname }}.{{ ansible_nas_domain }}`)"
          traefik.http.routers.partdb.tls.certresolver: "letsencrypt"
          traefik.http.routers.partdb.tls.domains[0].main: "{{ ansible_nas_domain }}"
          traefik.http.routers.partdb.tls.domains[0].sans: "*.{{ ansible_nas_domain }}"
          traefik.http.services.partdb.loadbalancer.server.port: "80"
      when: not (ansible_check_mode and partdb_network_result is changed) # network only exists after a real run
  when: partdb_enabled is true

- name: Stop partdb
  block:
    - name: Stop partdb
      community.docker.docker_container:
        name: "{{ item }}"
        state: absent
      loop:
        - "{{ partdb_container_name }}"
        - "{{ partdb_db_container }}"
  when: partdb_enabled is false
