---
- name: Start Forgejo
  block:
    - name: Create Forgejo Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      with_items:
        - "{{ forgejo_data_directory }}/forgejo"
        - "{{ forgejo_data_directory }}/postgres"

    - name: Create Forgejo network
      community.docker.docker_network:
        name: "{{ forgejo_network_name }}"
      register: forgejo_network_result

    - name: Create PostgreSQL container for Forgejo
      community.docker.docker_container:
        name: "{{ forgejo_db_container_name }}"
        image: "{{ forgejo_db_image_name }}:{{ forgejo_db_image_version }}"
        pull: true
        networks:
          - name: "{{ forgejo_network_name }}"
        network_mode: "{{ forgejo_network_name }}"
        volumes:
          - "{{ forgejo_data_directory }}/postgres:/var/lib/postgresql/data:rw"
        env:
          POSTGRES_DB: "{{ forgejo_db_name }}"
          POSTGRES_USER: "{{ forgejo_db_user }}"
          POSTGRES_PASSWORD: "{{ forgejo_db_password }}"
        restart_policy: unless-stopped
        memory: "{{ forgejo_db_memory }}"
      when: not (ansible_check_mode and forgejo_network_result is changed) # network only exists after a real run

    - name: Create Forgejo container
      community.docker.docker_container:
        name: "{{ forgejo_container_name }}"
        image: "{{ forgejo_image_name }}:{{ forgejo_image_version }}"
        pull: true
        networks:
          - name: "{{ forgejo_network_name }}"
        network_mode: "{{ forgejo_network_name }}"
        volumes:
          - "{{ forgejo_data_directory }}/forgejo:/data:rw"
        ports:
          - "{{ forgejo_port_http }}:3000"
          - "{{ forgejo_port_ssh }}:22"
        env:
          FORGEJO__database__DB_TYPE: "postgres"
          FORGEJO__database__HOST: "{{ forgejo_db_container_name }}:5432"
          FORGEJO__database__NAME: "{{ forgejo_db_name }}"
          FORGEJO__database__USER: "{{ forgejo_db_user }}"
          FORGEJO__database__PASSWD: "{{ forgejo_db_password }}"
          FORGEJO__server__SSH_DOMAIN: "{{ ansible_nas_hostname }}"
          FORGEJO__server__SSH_PORT: "{{ forgejo_port_ssh }}"
          FORGEJO__server__ROOT_URL: "{{ forgejo_root_url }}/"
          FORGEJO__server__HTTP_PORT: "3000"
          USER_UID: "1000"
          USER_GID: "1000"
        restart_policy: unless-stopped
        memory: "{{ forgejo_memory }}"
        labels:
          traefik.enable: "{{ forgejo_available_externally | string }}"
          traefik.http.routers.forgejo.rule: "Host(`{{ forgejo_hostname }}.{{ ansible_nas_domain }}`)"
          traefik.http.routers.forgejo.tls.certresolver: "letsencrypt"
          traefik.http.routers.forgejo.tls.domains[0].main: "{{ ansible_nas_domain }}"
          traefik.http.routers.forgejo.tls.domains[0].sans: "*.{{ ansible_nas_domain }}"
          traefik.http.services.forgejo.loadbalancer.server.port: "3000"
      when: not (ansible_check_mode and forgejo_network_result is changed) # network only exists after a real run
  when: forgejo_enabled is true

- name: Stop Forgejo
  block:
    - name: Stop Forgejo
      community.docker.docker_container:
        name: "{{ forgejo_container_name }}"
        state: absent

    - name: Stop Forgejo PostgreSQL
      community.docker.docker_container:
        name: "{{ forgejo_db_container_name }}"
        state: absent
  when: forgejo_enabled is false
