---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get Forgejo PostgreSQL container state
      community.docker.docker_container:
        name: "{{ forgejo_db_container_name }}"
      register: forgejo_result_db

    - name: Get Forgejo container state
      community.docker.docker_container:
        name: "{{ forgejo_container_name }}"
      register: forgejo_result

    - name: Check if Forgejo containers are running
      ansible.builtin.assert:
        that:
          - forgejo_result_db.container['State']['Status'] == "running"
          - forgejo_result_db.container['State']['Restarting'] == false
          - forgejo_result.container['State']['Status'] == "running"
          - forgejo_result.container['State']['Restarting'] == false
