---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Try and stop and remove Forgejo
      community.docker.docker_container:
        name: "{{ forgejo_container_name }}"
        state: absent
      register: forgejo_result

    - name: Try and stop and remove Forgejo PostgreSQL
      community.docker.docker_container:
        name: "{{ forgejo_db_container_name }}"
        state: absent
      register: forgejo_result_db

    - name: Check if Forgejo is stopped
      ansible.builtin.assert:
        that:
          - not forgejo_result.changed
          - not forgejo_result_db.changed
