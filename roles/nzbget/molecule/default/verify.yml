---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get nzbget container state
      community.docker.docker_container:
        name: "{{ nzbget_container_name }}"
      register: nzbget_result

    - name: Check if nzbget containers are running
      ansible.builtin.assert:
        that:
          - nzbget_result.container['State']['Status'] == "running"
          - nzbget_result.container['State']['Restarting'] == false
