---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get gotify container state
      community.docker.docker_container:
        name: "{{ gotify_container_name }}"
      register: gotify_result

    - name: Check if gotify containers are running
      ansible.builtin.assert:
        that:
          - gotify_result.container['State']['Status'] == "running"
          - gotify_result.container['State']['Restarting'] == false
