---
pyload_enabled: false
pyload_available_externally: false

# directories
pyload_config_directory: "{{ docker_home }}/pyload"
pyload_download_directory: "{{ downloads_root }}"

# uid / gid
pyload_user_id: "0"
pyload_group_id: "0"

# network
pyload_hostname: "pyload"
pyload_port: "8000"

# docker
pyload_container_name: "pyload"
pyload_image_name: "writl/pyload"
# 18.04 (digest pin; set to a tag such as "latest" to follow upstream instead)
pyload_image_version: "sha256:99875ba4ec3da994eab332fabece86ab66956b3338f1e23000328d000bc2141f"

# specs
pyload_memory: "1g"
