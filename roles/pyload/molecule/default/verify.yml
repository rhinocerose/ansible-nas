---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get pyload container state
      community.docker.docker_container:
        name: "{{ pyload_container_name }}"
      register: pyload_result

    - name: Check if pyload containers are running
      ansible.builtin.assert:
        that:
          - pyload_result.container['State']['Status'] == "running"
          - pyload_result.container['State']['Restarting'] == false
