---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Try and stop and remove Bitwarden
      community.docker.docker_container:
        name: "{{ bitwarden_container_name }}"
        state: absent
      register: bitwarden_result

    - name: Try and stop and remove Bitwarden Backup
      community.docker.docker_container:
        name: "{{ bitwarden_backup_container_name }}"
        state: absent
      register: bitwarden_result_backup

    - name: Check Bitwarden is stopped
      ansible.builtin.assert:
        that:
          - not bitwarden_result.changed
          - not bitwarden_result_backup.changed
