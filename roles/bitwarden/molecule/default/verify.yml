---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get container state
      community.docker.docker_container_info:
        name: "{{ bitwarden_container_name }}"
      register: bitwarden_result

    - name: Get container state
      community.docker.docker_container_info:
        name: "{{ bitwarden_backup_container_name }}"
      register: bitwarden_result_backup

    - name: Check Bitwarden is running
      ansible.builtin.assert:
        that:
          - bitwarden_result.container['State']['Status'] == "running"
          - bitwarden_result.container['State']['Restarting'] == false
          - bitwarden_result_backup.container['State']['Status'] == "running"
          - bitwarden_result_backup.container['State']['Restarting'] == false
