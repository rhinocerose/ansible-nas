---

- name: Start Bookstack
  block:
    - name: Create Bookstack directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      with_items:
        - "{{ bookstack_config_directory }}"
        - "{{ bookstack_db_config_directory }}"

    - name: Create Bookstack network
      community.docker.docker_network:
        name: "{{ bookstack_network_name }}"
      register: bookstack_network_result

    - name: Bookstack MariaDB Docker Container
      community.docker.docker_container:
        name: "{{ bookstack_db_container }}"
        image: "{{ bookstack_db_image_name }}:{{ bookstack_db_image_version }}"
        pull: true
        networks:
          - name: "{{ bookstack_network_name }}"
        network_mode: "{{ bookstack_network_name }}"
        volumes:
          - "{{ bookstack_db_config_directory }}/config:/config"
        env:
          TZ: "{{ ansible_nas_timezone }}"
          PUID: "{{ bookstack_user_id }}"
          PGID: "{{ bookstack_group_id }}"
          MYSQL_USER: "{{ bookstack_db_user }}"
          MYSQL_PASSWORD: "{{ bookstack_db_password }}"
          MYSQL_DATABASE: "{{ bookstack_db_name }}"
          MYSQL_ROOT_PASSWORD: "{{ bookstack_db_root_password }}"
        restart_policy: unless-stopped
        memory: "{{ bookstack_db_memory }}"
      when: not (ansible_check_mode and bookstack_network_result is changed) # network only exists after a real run

    - name: Bookstack Docker Container
      community.docker.docker_container:
        name: "{{ bookstack_container_name }}"
        image: "{{ bookstack_container_store }}/bookstack:{{ bookstack_version }}"
        pull: true
        networks:
          - name: "{{ bookstack_network_name }}"
        network_mode: "{{ bookstack_network_name }}"
        volumes:
          - "{{ bookstack_config_directory }}:/config"
        ports:
          - "{{ bookstack_port_http }}:80/tcp"
        env:
          TZ: "{{ ansible_nas_timezone }}"
          PUID: "{{ bookstack_user_id }}"
          PGID: "{{ bookstack_group_id }}"
          APP_URL: "{{ bookstack_app_url }}"
          DB_HOST: "{{ bookstack_db_container }}"
          DB_PORT: "3306"
          DB_DATABASE: "{{ bookstack_db_name }}"
          # current variable names
          DB_USERNAME: "{{ bookstack_db_user }}"
          DB_PASSWORD: "{{ bookstack_db_password }}"
          # legacy variable names, for older images
          DB_USER: "{{ bookstack_db_user }}"
          DB_PASS: "{{ bookstack_db_password }}"
        restart_policy: unless-stopped
        memory: "{{ bookstack_memory }}"
        labels:
          traefik.enable: "{{ bookstack_available_externally | string }}"
          traefik.http.routers.bookstack.rule: "Host(`{{ bookstack_hostname }}.{{ ansible_nas_domain }}`)"
          traefik.http.routers.bookstack.tls.certresolver: "letsencrypt"
          traefik.http.routers.bookstack.tls.domains[0].main: "{{ ansible_nas_domain }}"
          traefik.http.routers.bookstack.tls.domains[0].sans: "*.{{ ansible_nas_domain }}"
          traefik.http.services.bookstack.loadbalancer.server.port: "80"
      when: not (ansible_check_mode and bookstack_network_result is changed) # network only exists after a real run
  when: bookstack_enabled is true

- name: Stop Bookstack
  block:
    - name: Stop Bookstack
      community.docker.docker_container:
        name: "{{ item }}"
        state: absent
      loop:
        - "{{ bookstack_container_name }}"
        - "{{ bookstack_db_container }}"
  when: bookstack_enabled is false
