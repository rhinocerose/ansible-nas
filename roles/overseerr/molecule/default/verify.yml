---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get overseerr container state
      community.docker.docker_container:
        name: "{{ overseerr_container_name }}"
      register: overseerr_result

    - name: Check if overseerr containers are running
      ansible.builtin.assert:
        that:
          - overseerr_result.container['State']['Status'] == "running"
          - overseerr_result.container['State']['Restarting'] == false
