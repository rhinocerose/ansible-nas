---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get soulseek container state
      community.docker.docker_container:
        name: "{{ soulseek_container_name }}"
      register: soulseek_result

    - name: Check if soulseek containers are running
      ansible.builtin.assert:
        that:
          - soulseek_result.container['State']['Status'] == "running"
          - soulseek_result.container['State']['Restarting'] == false
