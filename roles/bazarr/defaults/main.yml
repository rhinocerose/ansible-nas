---
bazarr_enabled: false
bazarr_available_externally: false

# directories
bazarr_data_directory: "{{ docker_home }}/bazarr/config"
bazarr_tv_directory: "{{ tv_root }}"
bazarr_movies_directory: "{{ movies_root }}"

# uid/gid
bazarr_user_id: "0"
bazarr_group_id: "0"

# network
bazarr_port: "6767"
bazarr_hostname: "bazarr"

# specs
bazarr_memory: 1g

# docker
bazarr_container_name: bazarr

# image (pinned to the image running on the NAS; set to "latest" to follow upstream)
bazarr_image_name: "linuxserver/bazarr"
# v1.6.2-ls374 (digest pin; set to a tag such as "latest" to follow upstream instead)
bazarr_image_version: "sha256:b3db4247d3afa0c68bc5aa311bedd67b1caf4b3eabc3a85577682970435d5013"
