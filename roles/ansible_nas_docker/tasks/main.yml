---
# Installed from apt rather than pip: Debian 12+ / Ubuntu 23.04+ block system-wide pip
# installs (PEP 668), and the distro package stays in step with the system Python.
- name: Install docker python module
  ansible.builtin.apt:
    name: python3-docker
    state: present
  register: ansible_nas_docker_pip_result
  until: ansible_nas_docker_pip_result is succeeded

- name: Create Docker home directory
  ansible.builtin.file:
    path: "{{ docker_home }}"
    mode: "0755"
    state: directory

- name: Add user account to Docker group
  ansible.builtin.user:
    name: "{{ ansible_nas_user }}"
    groups: docker
    append: yes

- name: Generate Docker daemon.json
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_json | to_nice_json }}"
  register: ansible_nas_docker_daemon_config

- name: Restart Docker # noqa no-handler
  ansible.builtin.service:
    name: docker
    state: restarted
  when: ansible_nas_docker_daemon_config.changed
