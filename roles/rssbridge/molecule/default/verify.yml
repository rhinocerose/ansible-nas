---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get rssbridge container state
      community.docker.docker_container:
        name: "{{ rssbridge_container_name }}"
      register: rssbridge_result

    - name: Check if rssbridge containers are running
      ansible.builtin.assert:
        that:
          - rssbridge_result.container['State']['Status'] == "running"
          - rssbridge_result.container['State']['Restarting'] == false
