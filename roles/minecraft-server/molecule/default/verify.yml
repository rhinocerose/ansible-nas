---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.include_vars:
        file: ../../defaults/main.yml

    - name: Get minecraft_server container state
      community.docker.docker_container:
        name: "{{ minecraft_server_container_name }}"
      register: minecraft_server_result

    - name: Check if minecraft_server containers are running
      ansible.builtin.assert:
        that:
          - minecraft_server_result.container['State']['Status'] == "running"
          - minecraft_server_result.container['State']['Restarting'] == false
