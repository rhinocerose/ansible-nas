---
deluge_enabled: false
deluge_available_externally: false

# directories
deluge_config_directory: "{{ docker_home }}/deluge/config"
deluge_download_directory: "{{ downloads_root }}"
deluge_watch_directory: "{{ torrents_root }}"

# uid / gid
deluge_user_id: "0"
deluge_group_id: "0"

# error logging
deluge_log_level: "error"

# network
deluge_port: "8112"
deluge_hostname: "deluge"

deluge_timezone: "{{ ansible_nas_timezone }}"

# specs
deluge_memory: 1g

deluge_container_name: deluge

# image (pinned to the image running on the NAS; set to "latest" to follow upstream)
deluge_image_name: "linuxserver/deluge"
# 2.2.0-ls388 (digest pin; set to a tag such as "latest" to follow upstream instead)
deluge_image_version: "sha256:52314116ba684ae5cdcbd380758be2a5f7cc866b4235f44ba7af8ff7c35c42b7"
