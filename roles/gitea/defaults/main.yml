---
gitea_enabled: false
gitea_available_externally: false

# directories
gitea_data_directory: "{{ docker_home }}/gitea"

# network
gitea_hostname: "gitea"
gitea_network_name: "gitea"
gitea_port_http: "3001"
gitea_port_ssh: "222"

# specs
gitea_memory: 1g
gitea_mysql_memory: 1g

# docker
gitea_container_name: gitea
gitea_image_name: gitea/gitea
gitea_image_version: latest
gitea_user_id: "1000"
gitea_group_id: "1000"
gitea_mysql_container_name: gitea-mysql
gitea_mysql_image_name: mysql
gitea_mysql_image_version: "5.7"

# database
gitea_db_name: gitea
gitea_db_user: gitea
# Override these, ideally from Ansible Vault. The database only reads them when it's first
# created, so on an existing install set them to the current values (the old defaults below).
gitea_db_password: "gitea"
gitea_db_root_password: "gitea"
