jellyseerr_enabled: true
prowlarr_enabled: true
radarr_enabled: true
sonarr_enabled: true
lidarr_enabled: true

get_iplayer_enabled: false
youtubedlmaterial_enabled: true
pyload_enabled: true

wallabag_enabled: true
